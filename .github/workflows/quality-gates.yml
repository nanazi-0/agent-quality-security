name: agent-quality-gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Create isolated Python environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e . -r requirements-observability.txt
      - name: Install JavaScript quality tools
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start Phoenix observability service
        run: docker compose -f observability/docker-compose.yml up -d --wait
      - name: Run complete acceptance gates
        run: .venv/bin/python qualityctl.py pipeline
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-quality-reports
          path: reports/
